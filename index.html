<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest+</title>
</head>
<body>
    <form id="form">
        <!-- Incomes values -->
        <p>Income:</p>
        <input type="number" class="input-income">
    
        <!-- Expend values -->
        <p>Expend:</p>
        <input type="number" class="input-expend">

        <!-- Used to create a list of incomes and expends -->
        <button id="add-value">Computar</button>
    </form>

    <!-- Create a financial list -->
    <ul id="list"></ul>
    <!-- Print the result calculated by incomes - expends -->
    <p id="result"></p>
    
    <script src="main.js"></script>
</body>
</html>
